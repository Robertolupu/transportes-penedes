server {
  listen 80;
  server_name localhost 127.0.0.1 transportespenedes.es www.transportespenedes.es _;

  # Keep local development on HTTP, but force HTTPS on the public domain.
  if ($host ~* ^(www\.)?transportespenedes\.es$) {
    return 301 https://transportespenedes.es$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;

  location = /favicon.ico {
    try_files /favicon-v4.ico =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location = /favicon.png {
    try_files /favicon-v4.png =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location = /apple-touch-icon.png {
    try_files /apple-touch-icon-v4.png =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location /api/ {
    proxy_pass http://contact-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
